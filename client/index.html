<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Term Reader — Wakugumi / Jikugumi</title>
    <script>
      // Runs before the first paint so the app never flashes the wrong theme.
      // Same storage key as ThemeToggle.vue. Light is the default: dark is only
      // ever used when the user picked it, never because the OS is dark.
      (function () {
        try {
          var stored = localStorage.getItem('pdf-term-reader:theme');
          document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
